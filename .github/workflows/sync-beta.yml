name: Sync beta from main

on:
  push:
    branches: [main]

concurrency:
  group: sync-beta-from-main
  cancel-in-progress: false

jobs:
  create-sync-pr:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Create synchronization pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          open_pr_count="$(gh pr list --repo "$GH_REPO" --base beta --head main --state open --json number --jq 'length')"
          if [ "$open_pr_count" -eq 0 ]; then
            gh pr create \
              --repo "$GH_REPO" \
              --base beta \
              --head main \
              --title "chore: sync main into beta" \
              --body "Synchronizes \`main\` into \`beta\`. Merge this PR after CI passes. This updates the beta branch but does not publish a beta package."
          fi
