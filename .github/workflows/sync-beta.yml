name: Sync beta from main

on:
  push:
    branches: [main]

concurrency:
  group: sync-beta-from-main
  cancel-in-progress: false

jobs:
  create-sync-pr:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Create synchronization pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh pr list --base beta --head main --state open --json number --jq 'length' | grep -qx '0'; then
            gh pr create \
              --base beta \
              --head main \
              --title "chore: sync main into beta" \
              --body "Synchronizes \`main\` into \`beta\`. Merge this PR after CI passes. This updates the beta branch but does not publish a beta package."
          fi
